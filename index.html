<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 3px 3px 0 #1565c0, 0 0 24px rgba(255,255,255,0.4);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    #canvas-wrapper {
      border-radius: 20px;
      box-shadow:
        0 16px 48px rgba(0,0,0,0.4),
        0 0 0 5px #fff,
        0 0 0 9px #FFC107;
    }

    canvas {
      display: block;
      border-radius: 20px;
    }

    #score-display {
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      margin-top: 16px;
      letter-spacing: 1px;
    }

    #hint {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      margin-top: 8px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<h1>🐦 Flappy Bird</h1>
<div id="canvas-wrapper">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="score-display">Skor Tertinggi: <span id="best-score">0</span></div>
<div id="hint">Spasi / Klik / Sentuh = Terbang!</div>

<script>
/* ─── KONFIGURASI GAMBAR ─────────────────────────────── */
const DINO_SRC = "dino.png";

/* ─── CANVAS SETUP ───────────────────────────────────── */
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");

const BASE_W = 480;
const BASE_H = 640;
canvas.width  = BASE_W;
canvas.height = BASE_H;

/* ─── LOAD GAMBAR EKSTERNAL ──────────────────────────── */
const birdImg   = new Image();
let   birdReady = false;
let   birdError = false;
birdImg.onload  = () => { birdReady = true; };
birdImg.onerror = () => { birdError = true; };
birdImg.src     = DINO_SRC;

/* ─── KONSTANTA GAME ─────────────────────────────────── */
const GRAVITY    = 0.46;
const JUMP_VY    = -9.8;
const PIPE_SPEED = 3.2;
const PIPE_GAP   = 170;
const PIPE_W     = 64;
const PIPE_INT   = 240;   // interval frame antar pipa
const GROUND_H   = 52;
const BIRD_W     = 52;
const BIRD_H     = 44;
const BIRD_X     = 88;

/* ─── STATE ──────────────────────────────────────────── */
let bird, pipes, score, bestScore, frame, gameState, wingPhase;
// gameState: "IDLE" | "PLAYING" | "DEAD"

bestScore = 0;

function initGame() {
  bird = {
    y:   BASE_H / 2 - BIRD_H / 2,
    vy:  0,
    rot: 0
  };
  pipes     = [];
  score     = 0;
  frame     = 0;
  wingPhase = 0;
  gameState = "IDLE";
}

/* ─── INPUT ──────────────────────────────────────────── */
function handleInput() {
  if (gameState === "IDLE") {
    gameState = "PLAYING";
    bird.vy   = JUMP_VY;
  } else if (gameState === "PLAYING") {
    bird.vy   = JUMP_VY;
  } else if (gameState === "DEAD") {
    initGame();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); handleInput(); }
});
canvas.addEventListener("click",      () => handleInput());
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(); }, { passive: false });

/* ─── SPAWN PIPA ─────────────────────────────────────── */
function spawnPipe() {
  const playH  = BASE_H - GROUND_H;
  const minTop = 72;
  const maxTop = playH - PIPE_GAP - 72;
  const topH   = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: BASE_W + 10, topH, passed: false });
}

/* ─── COLLISION ──────────────────────────────────────── */
function collides(b, pipe) {
  const mg = 7;
  const bx = BIRD_X + mg, by = b.y + mg;
  const bw = BIRD_W - mg * 2, bh = BIRD_H - mg * 2;

  if (bx + bw < pipe.x || bx > pipe.x + PIPE_W) return false;
  if (by < pipe.topH)              return true;
  if (by + bh > pipe.topH + PIPE_GAP) return true;
  return false;
}

/* ═══════════════════════════════════════════════════════
   DRAW HELPERS
═══════════════════════════════════════════════════════ */

/* ── Langit + awan ── */
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H - GROUND_H);
  grad.addColorStop(0,   "#87CEEB");
  grad.addColorStop(0.6, "#b3e5fc");
  grad.addColorStop(1,   "#e0f7fa");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H - GROUND_H);

  drawCloud(55,  65, 52);
  drawCloud(210, 38, 38);
  drawCloud(360, 82, 60);
  drawCloud(445, 25, 30);
}

function drawCloud(x, y, r) {
  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.beginPath();
  ctx.arc(x,            y,           r * 0.65, 0, Math.PI * 2);
  ctx.arc(x + r * 0.6,  y - r * 0.3, r * 0.50, 0, Math.PI * 2);
  ctx.arc(x + r * 1.15, y,           r * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

/* ── Tanah ── */
function drawGround() {
  ctx.fillStyle = "#8B5E3C";
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, GROUND_H);
  ctx.fillStyle = "#5DBB5D";
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, 18);
  for (let gx = 4; gx < BASE_W; gx += 20) {
    ctx.fillStyle = "#4CAF50";
    ctx.beginPath();
    ctx.arc(gx + 8, BASE_H - GROUND_H + 4, 8, Math.PI, 0);
    ctx.fill();
  }
}

/* ── Pipa hijau bergaya klasik ── */
function drawPipes(pipe) {
  const playH = BASE_H - GROUND_H;
  const botY  = pipe.topH + PIPE_GAP;
  const botH  = playH - botY;

  drawPipeSegment(pipe.x, 0,    PIPE_W, pipe.topH, true);
  drawPipeSegment(pipe.x, botY, PIPE_W, botH,      false);
}

function drawPipeSegment(x, y, w, h, isTop) {
  if (h <= 0) return;

  const capH = 26, capExtra = 7;

  /* Badan pipa */
  const bodyGrad = ctx.createLinearGradient(x, 0, x + w, 0);
  bodyGrad.addColorStop(0,    "#1B5E20");
  bodyGrad.addColorStop(0.25, "#43A047");
  bodyGrad.addColorStop(0.55, "#66BB6A");
  bodyGrad.addColorStop(0.75, "#43A047");
  bodyGrad.addColorStop(1,    "#1B5E20");
  ctx.fillStyle = bodyGrad;

  if (isTop) {
    ctx.fillRect(x, y, w, h - capH);
  } else {
    ctx.fillRect(x, y + capH, w, h - capH);
  }

  /* Tutup pipa (cap) */
  const capY  = isTop ? (y + h - capH) : y;
  const capX  = x - capExtra;
  const capW  = w + capExtra * 2;

  const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
  capGrad.addColorStop(0,    "#1B5E20");
  capGrad.addColorStop(0.2,  "#388E3C");
  capGrad.addColorStop(0.5,  "#81C784");
  capGrad.addColorStop(0.8,  "#388E3C");
  capGrad.addColorStop(1,    "#1B5E20");
  ctx.fillStyle = capGrad;

  const r = 5;
  ctx.beginPath();
  if (isTop) {
    ctx.moveTo(capX + r, capY);
    ctx.arcTo(capX + capW, capY, capX + capW, capY + capH, r);
    ctx.lineTo(capX + capW, capY + capH);
    ctx.lineTo(capX, capY + capH);
    ctx.lineTo(capX, capY + r);
    ctx.arcTo(capX, capY, capX + r, capY, r);
  } else {
    ctx.moveTo(capX, capY);
    ctx.lineTo(capX + capW, capY);
    ctx.lineTo(capX + capW, capY + capH - r);
    ctx.arcTo(capX + capW, capY + capH, capX + capW - r, capY + capH, r);
    ctx.lineTo(capX + r, capY + capH);
    ctx.arcTo(capX, capY + capH, capX, capY + capH - r, r);
    ctx.lineTo(capX, capY);
  }
  ctx.closePath();
  ctx.fill();

  /* Highlight kilap */
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(x + 8, isTop ? y : y + capH + 2, 10, h - capH - 2);

  /* Garis tepi gelap */
  ctx.strokeStyle = "#1B5E20";
  ctx.lineWidth   = 1.5;
  if (isTop) {
    ctx.strokeRect(x, y, w, h - capH);
  } else {
    ctx.strokeRect(x, y + capH, w, h - capH);
  }
  ctx.strokeRect(capX, capY, capW, capH);
}

/* ── Burung ── */
function drawBird() {
  ctx.save();
  const cx = BIRD_X + BIRD_W / 2;
  const cy = bird.y  + BIRD_H / 2;
  ctx.translate(cx, cy);

  /* Rotasi halus */
  const targetRot = bird.vy > 2
    ? Math.min(bird.vy * 4.5, 75) * (Math.PI / 180)
    : (bird.vy < -2 ? -15 * (Math.PI / 180) : 0);
  bird.rot = bird.rot * 0.82 + targetRot * 0.18;
  ctx.rotate(bird.rot);

  if (birdReady && !birdError) {
    ctx.drawImage(birdImg, -BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H);
  } else {
    drawBirdShape();
  }

  ctx.restore();
}

function drawBirdShape() {
  /* Sudut sayap beranimasi */
  const wingAng = Math.sin(wingPhase) * 0.55;

  /* ── Sayap ── */
  ctx.save();
  ctx.rotate(wingAng);
  ctx.fillStyle   = "#FFB300";
  ctx.strokeStyle = "#E65100";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(-4, 2);
  ctx.quadraticCurveTo(-22, -10, -16, -24);
  ctx.quadraticCurveTo(-6,  -20,  0,  -8);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  /* ── Badan ── */
  const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 22);
  bodyGrad.addColorStop(0,   "#FFF176");
  bodyGrad.addColorStop(0.5, "#FFCA28");
  bodyGrad.addColorStop(1,   "#FF8F00");
  ctx.fillStyle   = bodyGrad;
  ctx.strokeStyle = "#E65100";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.ellipse(0, 2, 22, 18, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  /* ── Perut putih ── */
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.beginPath();
  ctx.ellipse(4, 6, 12, 9, 0.2, 0, Math.PI * 2);
  ctx.fill();

  /* ── Kepala ── */
  const headGrad = ctx.createRadialGradient(10, -14, 1, 12, -13, 13);
  headGrad.addColorStop(0,   "#FFF59D");
  headGrad.addColorStop(0.6, "#FFCA28");
  headGrad.addColorStop(1,   "#F57F17");
  ctx.fillStyle   = headGrad;
  ctx.strokeStyle = "#E65100";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.arc(12, -13, 13, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  /* ── Mata ── */
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(18, -17, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = "#1a1a2e";
  ctx.beginPath();
  ctx.arc(19.5, -17, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(21, -18.5, 1.4, 0, Math.PI * 2);
  ctx.fill();

  /* ── Paruh ── */
  ctx.fillStyle   = "#FF7043";
  ctx.strokeStyle = "#BF360C";
  ctx.lineWidth   = 1.5;
  /* Paruh atas */
  ctx.beginPath();
  ctx.moveTo(22, -16);
  ctx.lineTo(34, -14);
  ctx.lineTo(24, -11);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* Paruh bawah */
  ctx.fillStyle = "#FF8A65";
  ctx.beginPath();
  ctx.moveTo(22, -11);
  ctx.lineTo(32, -11);
  ctx.lineTo(23, -8);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  /* ── Pipi merah ── */
  ctx.fillStyle = "rgba(255,100,100,0.45)";
  ctx.beginPath();
  ctx.ellipse(14, -10, 5, 3.5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  /* ── Ekor ── */
  ctx.fillStyle   = "#FFB300";
  ctx.strokeStyle = "#E65100";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 4);
  ctx.quadraticCurveTo(-34, -2,  -30, -14);
  ctx.quadraticCurveTo(-24, -18, -16, -8);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* Bulu ekor kedua */
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.moveTo(-16, 8);
  ctx.quadraticCurveTo(-32, 10, -30, -2);
  ctx.quadraticCurveTo(-24, -6, -14, 4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

/* ── Skor di canvas ── */
function drawScore() {
  ctx.save();
  ctx.font        = "bold 34px 'Segoe UI', sans-serif";
  ctx.textAlign   = "center";
  ctx.lineWidth   = 5;
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.fillStyle   = "#fff";
  ctx.strokeText(score, BASE_W / 2, 54);
  ctx.fillText(score,   BASE_W / 2, 54);
  ctx.restore();
}

/* ── Panel overlay (Game Over / Idle) ── */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + r, y,     r);
  ctx.closePath();
}

function drawGameOverOverlay() {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.42)";
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const pw = 320, ph = 248;
  const px = (BASE_W - pw) / 2;
  const py = (BASE_H - ph) / 2;

  /* Panel */
  ctx.fillStyle   = "#fff";
  ctx.strokeStyle = "#FFC107";
  ctx.lineWidth   = 5;
  roundRect(px, py, pw, ph, 22);
  ctx.fill(); ctx.stroke();

  /* Judul */
  ctx.font      = "bold 40px 'Segoe UI', cursive";
  ctx.fillStyle = "#E53935";
  ctx.textAlign = "center";
  ctx.fillText("Game Over!", BASE_W / 2, py + 68);

  /* Ikon burung kecil */
  ctx.font      = "28px sans-serif";
  ctx.fillText("🐦", BASE_W / 2, py + 108);

  /* Skor */
  ctx.font      = "20px 'Segoe UI', cursive";
  ctx.fillStyle = "#546E7A";
  ctx.fillText(`Skor Kamu : ${score}`,    BASE_W / 2, py + 142);
  ctx.fillText(`Skor Terbaik : ${bestScore}`, BASE_W / 2, py + 170);

  /* Tombol */
  const bw = 188, bh = 50;
  const bx = (BASE_W - bw) / 2;
  const by = py + 186;
  ctx.fillStyle   = "#FFC107";
  ctx.strokeStyle = "#E65100";
  ctx.lineWidth   = 3;
  roundRect(bx, by, bw, bh, 14);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 20px 'Segoe UI', cursive";
  ctx.fillStyle = "#fff";
  ctx.fillText("🔄  Main Lagi!", BASE_W / 2, by + 33);

  ctx.restore();
}

function drawIdleOverlay() {
  ctx.save();
  const pw = 300, ph = 166;
  const px = (BASE_W - pw) / 2;
  const py = BASE_H / 2 - 130;

  ctx.fillStyle   = "rgba(255,255,255,0.93)";
  ctx.strokeStyle = "#FFC107";
  ctx.lineWidth   = 4;
  roundRect(px, py, pw, ph, 18);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 28px 'Segoe UI', cursive";
  ctx.fillStyle = "#1565C0";
  ctx.textAlign = "center";
  ctx.fillText("🐦  Flappy Bird", BASE_W / 2, py + 52);

  ctx.font      = "17px 'Segoe UI', cursive";
  ctx.fillStyle = "#546E7A";
  ctx.fillText("Spasi / Klik / Sentuh", BASE_W / 2, py + 90);
  ctx.fillText("untuk mulai terbang!", BASE_W / 2, py + 116);

  ctx.font      = "13px 'Segoe UI', cursive";
  ctx.fillStyle = "#90A4AE";
  ctx.fillText("Hindari pipa dan jangan jatuh!", BASE_W / 2, py + 146);

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   GAME LOOP
═══════════════════════════════════════════════════════ */

function update() {
  if (gameState !== "PLAYING") return;

  frame++;
  wingPhase += 0.22;

  /* Fisika */
  bird.vy += GRAVITY;
  bird.y  += bird.vy;

  /* Spawn pipa */
  if (frame % PIPE_INT === 1) spawnPipe();

  /* Update pipa */
  const playH = BASE_H - GROUND_H;
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    /* Hitung skor */
    if (!pipes[i].passed && pipes[i].x + PIPE_W < BIRD_X) {
      pipes[i].passed = true;
      score++;
      if (score > bestScore) {
        bestScore = score;
        document.getElementById("best-score").textContent = bestScore;
      }
    }

    /* Hapus pipa out-of-screen */
    if (pipes[i].x + PIPE_W < -20) {
      pipes.splice(i, 1);
      continue;
    }

    /* Deteksi tabrakan */
    if (collides(bird, pipes[i])) {
      gameState = "DEAD";
      return;
    }
  }

  /* Tanah & langit-langit */
  if (bird.y + BIRD_H >= playH) {
    bird.y    = playH - BIRD_H;
    gameState = "DEAD";
  }
  if (bird.y <= 0) {
    bird.y    = 0;
    gameState = "DEAD";
  }
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);

  drawBackground();
  for (const p of pipes) drawPipes(p);
  drawGround();
  drawBird();

  if (gameState === "PLAYING" || gameState === "DEAD") drawScore();
  if (gameState === "IDLE")  drawIdleOverlay();
  if (gameState === "DEAD")  drawGameOverOverlay();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ─── MULAI ──────────────────────────────────────────── */
initGame();
loop();
</script>
</body>
</html>
