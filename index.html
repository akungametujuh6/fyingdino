<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Dino</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #87CEEB 0%, #a8edea 50%, #fed6e3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
      user-select: none;
    }

    h1 {
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 3px 3px 0 #e07b00, 0 0 20px rgba(255,160,0,0.5);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    #canvas-wrapper {
      position: relative;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 5px #fff, 0 0 0 8px #ffa726;
    }

    canvas {
      display: block;
      border-radius: 20px;
      background: #e0f7fa;
    }

    #score-display {
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      margin-top: 14px;
      letter-spacing: 1px;
    }

    #hint {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      margin-top: 8px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <h1>🦕 Flappy Dino</h1>
  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="score-display">Skor Tertinggi: <span id="best-score">0</span></div>
  <div id="hint">Spasi / Klik / Sentuh = Terbang!</div>

<script>
/* ─── KONFIGURASI GAMBAR ─────────────────────────────── */
const DINO_SRC = "dino.png";

/* ─── SETUP CANVAS ───────────────────────────────────── */
const canvas  = document.getElementById("gameCanvas");
const ctx     = canvas.getContext("2d");

const BASE_W  = 480;
const BASE_H  = 640;
canvas.width  = BASE_W;
canvas.height = BASE_H;

/* ─── LOAD DINO IMAGE ────────────────────────────────── */
const dinoImg   = new Image();
let   dinoReady = false;
let   dinoError = false;

dinoImg.onload  = () => { dinoReady = true; };
dinoImg.onerror = () => { dinoError = true; };
dinoImg.src     = DINO_SRC;

/* ─── WARNA & STYLE TEMA ─────────────────────────────── */
const SKY_TOP    = "#b3e5fc";
const SKY_BOT    = "#e0f7fa";
const GROUND_COL = "#6d4c41";
const GRASS_COL  = "#66bb6a";

/* ─── KONSTANTA GAME ─────────────────────────────────── */
const GRAVITY      = 0.45;
const JUMP_POWER   = -9.5;
const PIPE_SPEED   = 3.2;
const PIPE_GAP     = 175;
const PIPE_W       = 62;
const PIPE_SPAWN   = 240;
const GROUND_H     = 50;
const DINO_W       = 58;
const DINO_H       = 52;
const DINO_X       = 90;

/* ─── STATE GAME ─────────────────────────────────────── */
let dino, pipes, score, bestScore, frame, gameState;
// gameState: "IDLE" | "PLAYING" | "DEAD"

function initGame() {
  dino = {
    y:   BASE_H / 2 - DINO_H / 2,
    vy:  0,
    rot: 0
  };
  pipes     = [];
  score     = 0;
  frame     = 0;
  gameState = "IDLE";
}

/* ─── BUAT PIPA / BATU ───────────────────────────────── */
function spawnPipe() {
  const playH   = BASE_H - GROUND_H;
  const minTop  = 80;
  const maxTop  = playH - PIPE_GAP - 80;
  const topH    = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: BASE_W + 20, topH, passed: false });
}

/* ─── INPUT HANDLER ──────────────────────────────────── */
function handleInput() {
  if (gameState === "IDLE") {
    gameState = "PLAYING";
    dino.vy   = JUMP_POWER;
  } else if (gameState === "PLAYING") {
    dino.vy = JUMP_POWER;
  } else if (gameState === "DEAD") {
    initGame();
    gameState = "IDLE";
  }
}

document.addEventListener("keydown",    (e) => { if (e.code === "Space") { e.preventDefault(); handleInput(); } });
canvas.addEventListener("click",        ()  => handleInput());
canvas.addEventListener("touchstart",   (e) => { e.preventDefault(); handleInput(); }, { passive: false });

/* ─── COLLISION (AABB) ───────────────────────────────── */
function collides(dino, pipe) {
  const margin = 6;
  const dx = DINO_X + margin, dy = dino.y + margin;
  const dw = DINO_W - margin * 2, dh = DINO_H - margin * 2;
  const px = pipe.x, pw = PIPE_W;
  const playH = BASE_H - GROUND_H;

  if (dx + dw < px || dx > px + pw) return false;
  if (dy < pipe.topH) return true;
  if (dy + dh > pipe.topH + PIPE_GAP) return true;
  return false;
}

/* ─────────────────────────────────────────────────────── */
/*  DRAWING HELPERS                                         */
/* ─────────────────────────────────────────────────────── */

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H - GROUND_H);
  grad.addColorStop(0, SKY_TOP);
  grad.addColorStop(1, SKY_BOT);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H - GROUND_H);

  // Awan dekoratif
  drawCloud(60,  70, 55);
  drawCloud(220, 45, 40);
  drawCloud(370, 90, 65);
  drawCloud(440, 30, 35);
}

function drawCloud(x, y, r) {
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath();
  ctx.arc(x,      y,     r * 0.65, 0, Math.PI * 2);
  ctx.arc(x + r * 0.6, y - r * 0.25, r * 0.5,  0, Math.PI * 2);
  ctx.arc(x + r * 1.1, y,     r * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = GROUND_COL;
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, GROUND_H);
  ctx.fillStyle = GRASS_COL;
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, 16);
  // Rumput detail
  for (let gx = 0; gx < BASE_W; gx += 18) {
    ctx.fillStyle = "#43a047";
    ctx.beginPath();
    ctx.arc(gx + 9, BASE_H - GROUND_H + 3, 7, Math.PI, 0);
    ctx.fill();
  }
}

function drawLavaRock(x, topH) {
  const playH  = BASE_H - GROUND_H;
  const botY   = topH + PIPE_GAP;
  const botH   = playH - botY;

  // Gambar batu atas
  drawRockSegment(x, 0, PIPE_W, topH, true);
  // Gambar batu bawah
  drawRockSegment(x, botY, PIPE_W, botH, false);
  // Lava glow di celah
  const glowY = topH;
  const glowH = PIPE_GAP;
  const glow  = ctx.createLinearGradient(x, glowY, x, glowY + glowH);
  glow.addColorStop(0,   "rgba(255,80,0,0.25)");
  glow.addColorStop(0.5, "rgba(255,200,0,0.05)");
  glow.addColorStop(1,   "rgba(255,80,0,0.25)");
  ctx.fillStyle = glow;
  ctx.fillRect(x - 4, glowY, PIPE_W + 8, glowH);
}

function drawRockSegment(x, y, w, h, isTop) {
  if (h <= 0) return;
  const r = 10;

  // Badan batu gelap
  ctx.fillStyle = "#546e7a";
  ctx.beginPath();
  if (isTop) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
  } else {
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();

  // Tepi batu lebih terang
  ctx.fillStyle = "#78909c";
  ctx.fillRect(x + 8, y + (isTop ? 0 : 8), 10, h - 8);
  ctx.fillRect(x + w - 16, y + (isTop ? 0 : 8), 8, h - 8);

  // Lava di ujung (api kecil)
  if (isTop) {
    drawLavaEdge(x, y + h, w, false);
  } else {
    drawLavaEdge(x, y, w, true);
  }
}

function drawLavaEdge(x, y, w, flameUp) {
  const fCount = Math.floor(w / 14);
  for (let i = 0; i < fCount; i++) {
    const fx  = x + i * 14 + 4;
    const dir = flameUp ? -1 : 1;
    const fh  = 10 + Math.random() * 0 + Math.sin(frame * 0.15 + i) * 4;
    const fg  = ctx.createLinearGradient(fx, y, fx, y + dir * fh);
    fg.addColorStop(0,   "#ff6d00");
    fg.addColorStop(0.5, "#ffca28");
    fg.addColorStop(1,   "rgba(255,200,0,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx, y);
    ctx.quadraticCurveTo(fx + 5, y + dir * fh * 0.5, fx + 10, y + dir * fh);
    ctx.quadraticCurveTo(fx + 13, y + dir * fh * 0.6, fx + 14, y);
    ctx.closePath();
    ctx.fill();
  }
}

function drawDino() {
  ctx.save();
  const cx = DINO_X + DINO_W / 2;
  const cy = dino.y + DINO_H / 2;
  ctx.translate(cx, cy);

  // Rotasi saat jatuh
  const targetRot = dino.vy > 3 ? Math.min(dino.vy * 4, 70) * (Math.PI / 180) : 0;
  dino.rot = dino.rot * 0.85 + targetRot * 0.15;
  ctx.rotate(dino.rot);

  if (dinoReady && !dinoError) {
    // Gambar dari file eksternal
    ctx.drawImage(dinoImg, -DINO_W / 2, -DINO_H / 2, DINO_W, DINO_H);
  } else {
    // Placeholder: dino ASCII sederhana dari shapes
    drawDinoShape();
  }

  ctx.restore();
}

function drawDinoShape() {
  // Badan
  ctx.fillStyle   = "#66bb6a";
  ctx.strokeStyle = "#2e7d32";
  ctx.lineWidth   = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, 4, 24, 20, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Kepala
  ctx.beginPath();
  ctx.ellipse(18, -6, 16, 13, 0.3, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Mata
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(24, -10, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a237e";
  ctx.beginPath();
  ctx.arc(25, -10, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Highlight mata
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(26.5, -11.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Moncong
  ctx.fillStyle = "#a5d6a7";
  ctx.strokeStyle = "#2e7d32";
  ctx.beginPath();
  ctx.ellipse(32, -3, 8, 5, 0.1, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Ekor
  ctx.fillStyle   = "#66bb6a";
  ctx.strokeStyle = "#2e7d32";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-34, -12, -28, -22);
  ctx.quadraticCurveTo(-20, -28, -14, -18);
  ctx.fill(); ctx.stroke();

  // Sayap kecil (karena Flappy)
  ctx.fillStyle   = "#aed581";
  ctx.strokeStyle = "#558b2f";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.quadraticCurveTo(-10, -28, 8, -26);
  ctx.quadraticCurveTo(14, -30, 12, -16);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function drawScore() {
  ctx.save();
  ctx.font         = "bold 32px 'Segoe UI', cursive";
  ctx.fillStyle    = "rgba(255,255,255,0.95)";
  ctx.strokeStyle  = "rgba(0,0,0,0.3)";
  ctx.lineWidth    = 4;
  ctx.textAlign    = "center";
  ctx.strokeText(score, BASE_W / 2, 50);
  ctx.fillText(score, BASE_W / 2, 50);
  ctx.restore();
}

function drawOverlay(title, sub1, sub2) {
  // Panel
  ctx.save();
  ctx.fillStyle   = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const pw = 320, ph = 240;
  const px = (BASE_W - pw) / 2, py = (BASE_H - ph) / 2;

  // Kotak panel
  ctx.fillStyle   = "#fff";
  ctx.strokeStyle = "#ffa726";
  ctx.lineWidth   = 5;
  roundRect(ctx, px, py, pw, ph, 22);
  ctx.fill(); ctx.stroke();

  // Judul
  ctx.font      = "bold 38px 'Segoe UI', cursive";
  ctx.fillStyle = "#e53935";
  ctx.textAlign = "center";
  ctx.fillText(title, BASE_W / 2, py + 68);

  // Subtext
  ctx.font      = "20px 'Segoe UI', cursive";
  ctx.fillStyle = "#546e7a";
  ctx.fillText(sub1, BASE_W / 2, py + 112);
  ctx.fillText(sub2, BASE_W / 2, py + 142);

  // Tombol
  const bw = 180, bh = 48;
  const bx = (BASE_W - bw) / 2, by = py + 166;
  ctx.fillStyle   = "#ffa726";
  ctx.strokeStyle = "#e65100";
  ctx.lineWidth   = 3;
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 20px 'Segoe UI', cursive";
  ctx.fillStyle = "#fff";
  ctx.fillText("🔄  Main Lagi!", BASE_W / 2, by + 32);

  ctx.restore();
}

function drawIdleOverlay() {
  ctx.save();
  const pw = 300, ph = 160;
  const px = (BASE_W - pw) / 2, py = BASE_H / 2 - 120;

  ctx.fillStyle   = "rgba(255,255,255,0.92)";
  ctx.strokeStyle = "#ffa726";
  ctx.lineWidth   = 4;
  roundRect(ctx, px, py, pw, ph, 18);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 26px 'Segoe UI', cursive";
  ctx.fillStyle = "#37474f";
  ctx.textAlign = "center";
  ctx.fillText("🦕 Flappy Dino", BASE_W / 2, py + 50);

  ctx.font      = "17px 'Segoe UI', cursive";
  ctx.fillStyle = "#78909c";
  ctx.fillText("Spasi / Klik / Sentuh", BASE_W / 2, py + 88);
  ctx.fillText("untuk mulai terbang!", BASE_W / 2, py + 114);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ─────────────────────────────────────────────────────── */
/*  GAME LOOP                                               */
/* ─────────────────────────────────────────────────────── */

let bestScore = 0;

function update() {
  if (gameState !== "PLAYING") return;

  frame++;

  // Fisika dino
  dino.vy += GRAVITY;
  dino.y  += dino.vy;

  // Spawn pipa
  if (frame % PIPE_SPAWN === 0) spawnPipe();

  // Update & cek pipa
  const playH = BASE_H - GROUND_H;
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    // Skor
    if (!pipes[i].passed && pipes[i].x + PIPE_W < DINO_X) {
      pipes[i].passed = true;
      score++;
      if (score > bestScore) {
        bestScore = score;
        document.getElementById("best-score").textContent = bestScore;
      }
    }

    // Hapus pipa keluar layar
    if (pipes[i].x + PIPE_W < -10) {
      pipes.splice(i, 1);
      continue;
    }

    // Collision
    if (collides(dino, pipes[i])) {
      gameState = "DEAD";
    }
  }

  // Tanah & langit-langit
  if (dino.y + DINO_H >= playH || dino.y <= 0) {
    gameState = "DEAD";
    dino.y = Math.min(dino.y, playH - DINO_H);
  }
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);
  drawBackground();

  // Pipa/batu
  for (const p of pipes) drawLavaRock(p.x, p.topH);

  drawGround();
  drawDino();
  if (gameState === "PLAYING" || gameState === "DEAD") drawScore();

  if (gameState === "IDLE") {
    drawIdleOverlay();
  } else if (gameState === "DEAD") {
    drawOverlay(
      "Game Over!",
      `Skor Kamu: ${score}`,
      `Terbaik: ${bestScore}`
    );
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ─── START ──────────────────────────────────────────── */
initGame();
loop();
</script>
</body>
</html>
