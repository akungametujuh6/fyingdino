<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pterodaktil.fun</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a0533 0%, #2d0a4e 40%, #4a1060 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', 'Segoe UI', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* Bintang-bintang latar */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10%  15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25%  40%, #ffd 0%, transparent 100%),
        radial-gradient(1px 1px at 60%   8%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 80%  25%, #ffd 0%, transparent 100%),
        radial-gradient(1px 1px at 45%  60%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 90%  70%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 5%   80%, rgba(255,200,100,0.6) 0%, transparent 100%),
        radial-gradient(2px 2px at 70%  90%, rgba(255,150,200,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      position: relative;
      z-index: 1;
      font-size: 2.6rem;
      color: #FF6B35;
      text-shadow:
        3px 3px 0 #7B1FA2,
        6px 6px 0 rgba(123,31,162,0.4),
        0 0 30px rgba(255,107,53,0.6);
      letter-spacing: 3px;
      margin-bottom: 14px;
    }

    #canvas-wrapper {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.7),
        0 0 0 4px #FF6B35,
        0 0 0 8px #7B1FA2,
        0 0 40px rgba(255,107,53,0.4);
    }

    canvas {
      display: block;
      border-radius: 22px;
    }

    #score-display {
      position: relative;
      z-index: 1;
      font-size: 1.1rem;
      color: #FFB74D;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
      margin-top: 14px;
      letter-spacing: 1px;
    }

    #hint {
      position: relative;
      z-index: 1;
      font-size: 0.88rem;
      color: rgba(255,200,150,0.8);
      margin-top: 6px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<h1>🦕 pterodaktil.fun</h1>
<div id="canvas-wrapper">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="score-display">Skor Tertinggi: <span id="best-score">0</span></div>
<div id="hint">Spasi / Klik / Sentuh = Terbang!</div>

<script>
/* ─── GAMBAR PTERODAKTIL ─────────────────────────────── */
const DINO_SRC = "dino.png";

/* ─── CANVAS ─────────────────────────────────────────── */
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");
const BASE_W = 480;
const BASE_H = 640;
canvas.width  = BASE_W;
canvas.height = BASE_H;

/* ─── LOAD GAMBAR ────────────────────────────────────── */
const pteroImg  = new Image();
let pteroReady  = false;
let pteroError  = false;
pteroImg.onload  = () => { pteroReady = true; };
pteroImg.onerror = () => { pteroError = true; };
pteroImg.src     = DINO_SRC;

/* ─── KONSTANTA ──────────────────────────────────────── */
const GRAVITY    = 0.46;
const JUMP_VY    = -9.8;
const PIPE_SPEED = 3.2;
const PIPE_GAP   = 172;
const PIPE_W     = 66;
const PIPE_INT   = 240;
const GROUND_H   = 54;
const PTERO_W    = 64;
const PTERO_H    = 56;
const PTERO_X    = 88;

/* ─── STATE ──────────────────────────────────────────── */
let ptero, pipes, score, bestScore, frame, gameState, wingPhase;
bestScore = 0;

/* Paralaks awan prasejarah */
let clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x:    Math.random() * BASE_W,
    y:    30 + Math.random() * (BASE_H * 0.55),
    r:    28 + Math.random() * 36,
    spd:  0.3 + Math.random() * 0.5,
    alpha: 0.12 + Math.random() * 0.18
  });
}

function initGame() {
  ptero = { y: BASE_H / 2 - PTERO_H / 2, vy: 0, rot: 0 };
  pipes     = [];
  score     = 0;
  frame     = 0;
  wingPhase = 0;
  gameState = "IDLE";
}

/* ─── INPUT ──────────────────────────────────────────── */
function handleInput() {
  if (gameState === "IDLE") {
    gameState = "PLAYING";
    ptero.vy  = JUMP_VY;
  } else if (gameState === "PLAYING") {
    ptero.vy  = JUMP_VY;
  } else if (gameState === "DEAD") {
    initGame();
  }
}
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); handleInput(); } });
canvas.addEventListener("click",      () => handleInput());
canvas.addEventListener("touchstart", e => { e.preventDefault(); handleInput(); }, { passive: false });

/* ─── SPAWN RINTANGAN ────────────────────────────────── */
function spawnPipe() {
  const playH  = BASE_H - GROUND_H;
  const minTop = 70;
  const maxTop = playH - PIPE_GAP - 70;
  pipes.push({ x: BASE_W + 10, topH: Math.random() * (maxTop - minTop) + minTop, passed: false });
}

/* ─── COLLISION ──────────────────────────────────────── */
function collides(p, pipe) {
  const mg = 8;
  const px = PTERO_X + mg, py = p.y + mg;
  const pw = PTERO_W - mg * 2, ph = PTERO_H - mg * 2;
  if (px + pw < pipe.x || px > pipe.x + PIPE_W) return false;
  if (py < pipe.topH)                return true;
  if (py + ph > pipe.topH + PIPE_GAP)   return true;
  return false;
}

/* ═══════════════════════════════════════════════════════
   DRAW — BACKGROUND
═══════════════════════════════════════════════════════ */
function drawBackground() {
  /* Langit merah-ungu senja prasejarah */
  const sky = ctx.createLinearGradient(0, 0, 0, BASE_H - GROUND_H);
  sky.addColorStop(0,    "#120028");
  sky.addColorStop(0.35, "#3D0070");
  sky.addColorStop(0.65, "#8B1A4A");
  sky.addColorStop(1,    "#C0392B");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, BASE_W, BASE_H - GROUND_H);

  /* Gunung berapi di latar */
  drawVolcano(60,  BASE_H - GROUND_H, 90, 170);
  drawVolcano(350, BASE_H - GROUND_H, 70, 130);
  drawVolcano(440, BASE_H - GROUND_H, 50, 90);

  /* Awan asap/nebula bergerak */
  for (const c of clouds) {
    ctx.fillStyle = `rgba(255,150,80,${c.alpha})`;
    ctx.beginPath();
    ctx.arc(c.x,           c.y,     c.r * 0.7,  0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.6, c.y - c.r * 0.2, c.r * 0.55, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 1.2, c.y,     c.r * 0.65, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Lahar mengalir di latar (glow) */
  const lava = ctx.createLinearGradient(0, BASE_H - GROUND_H - 40, 0, BASE_H - GROUND_H);
  lava.addColorStop(0, "rgba(255,80,0,0)");
  lava.addColorStop(1, "rgba(255,80,0,0.35)");
  ctx.fillStyle = lava;
  ctx.fillRect(0, BASE_H - GROUND_H - 40, BASE_W, 40);
}

function drawVolcano(cx, baseY, w, h) {
  const grad = ctx.createLinearGradient(cx - w / 2, baseY - h, cx + w / 2, baseY);
  grad.addColorStop(0, "#1a0010");
  grad.addColorStop(1, "#3d1020");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, baseY);
  ctx.lineTo(cx - w * 0.12, baseY - h);
  ctx.lineTo(cx + w * 0.12, baseY - h);
  ctx.lineTo(cx + w / 2, baseY);
  ctx.closePath();
  ctx.fill();
  /* Lahar di kawah */
  const glow = ctx.createRadialGradient(cx, baseY - h, 2, cx, baseY - h + 8, 22);
  glow.addColorStop(0,   "rgba(255,160,0,0.9)");
  glow.addColorStop(0.5, "rgba(255,60,0,0.5)");
  glow.addColorStop(1,   "rgba(255,0,0,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.ellipse(cx, baseY - h + 6, 22, 12, 0, 0, Math.PI * 2);
  ctx.fill();
}

/* ─── GROUND ─────────────────────────────────────────── */
function drawGround() {
  /* Lava river */
  const lavaGrad = ctx.createLinearGradient(0, BASE_H - GROUND_H, 0, BASE_H);
  lavaGrad.addColorStop(0,    "#FF4500");
  lavaGrad.addColorStop(0.25, "#FF6D00");
  lavaGrad.addColorStop(0.5,  "#FF8C00");
  lavaGrad.addColorStop(1,    "#BF360C");
  ctx.fillStyle = lavaGrad;
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, GROUND_H);

  /* Batu-batu di tepi lahar */
  ctx.fillStyle = "#1a0a00";
  ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, 14);
  for (let gx = 0; gx < BASE_W; gx += 22) {
    ctx.fillStyle = `rgba(30,10,0,${0.7 + Math.sin(gx) * 0.2})`;
    ctx.beginPath();
    ctx.arc(gx + 10, BASE_H - GROUND_H + 7, 9 + Math.sin(gx * 0.7) * 2, Math.PI, 0);
    ctx.fill();
  }

  /* Lava glow shimmer */
  for (let lx = 0; lx < BASE_W; lx += 40) {
    const shimmer = ctx.createRadialGradient(lx + 20, BASE_H - GROUND_H + 28, 0, lx + 20, BASE_H - GROUND_H + 28, 28);
    shimmer.addColorStop(0,   `rgba(255,220,0,${0.15 + Math.abs(Math.sin(frame * 0.04 + lx)) * 0.15})`);
    shimmer.addColorStop(1,   "rgba(255,100,0,0)");
    ctx.fillStyle = shimmer;
    ctx.fillRect(lx, BASE_H - GROUND_H, 40, GROUND_H);
  }
}

/* ─── RINTANGAN BATU PRASEJARAH ──────────────────────── */
function drawObstacle(pipe) {
  const playH = BASE_H - GROUND_H;
  const botY  = pipe.topH + PIPE_GAP;
  const botH  = playH - botY;
  drawRock(pipe.x, 0,    PIPE_W, pipe.topH, true);
  drawRock(pipe.x, botY, PIPE_W, botH,      false);

  /* Lahar di celah (glow) */
  const gap = ctx.createLinearGradient(pipe.x, pipe.topH, pipe.x, pipe.topH + PIPE_GAP);
  gap.addColorStop(0,   "rgba(255,80,0,0.2)");
  gap.addColorStop(0.5, "rgba(255,150,0,0.05)");
  gap.addColorStop(1,   "rgba(255,80,0,0.2)");
  ctx.fillStyle = gap;
  ctx.fillRect(pipe.x - 3, pipe.topH, PIPE_W + 6, PIPE_GAP);
}

function drawRock(x, y, w, h, isTop) {
  if (h <= 0) return;
  const r = 8;

  /* Badan batu */
  const rg = ctx.createLinearGradient(x, 0, x + w, 0);
  rg.addColorStop(0,    "#1a0028");
  rg.addColorStop(0.25, "#3d1060");
  rg.addColorStop(0.6,  "#5e2080");
  rg.addColorStop(0.8,  "#3d1060");
  rg.addColorStop(1,    "#1a0028");
  ctx.fillStyle = rg;

  ctx.beginPath();
  if (isTop) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + r,     r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x,     y + h);
    ctx.lineTo(x,     y + r);
    ctx.arcTo(x,     y,     x + r, y,         r);
  } else {
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x,     y + h, x, y + h - r,     r);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();

  /* Garis tepi batu */
  ctx.strokeStyle = "#7B1FA2";
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  /* Kilap ungu di sisi kiri */
  ctx.fillStyle = "rgba(180,100,255,0.18)";
  ctx.fillRect(x + 7, isTop ? y : y + 6, 9, h - 6);

  /* Api lahar di ujung */
  drawLavaFlame(x, isTop ? y + h : y, w, isTop ? 1 : -1);
}

function drawLavaFlame(x, y, w, dir) {
  const count = Math.floor(w / 13);
  for (let i = 0; i < count; i++) {
    const fx = x + i * 13 + 4;
    const fh = 8 + Math.sin(frame * 0.14 + i * 1.3) * 5;
    const fg = ctx.createLinearGradient(fx, y, fx, y + dir * fh);
    fg.addColorStop(0,   "#FF6D00");
    fg.addColorStop(0.5, "#FFCA28");
    fg.addColorStop(1,   "rgba(255,200,0,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx, y);
    ctx.quadraticCurveTo(fx + 4,  y + dir * fh * 0.5, fx + 8,  y + dir * fh);
    ctx.quadraticCurveTo(fx + 12, y + dir * fh * 0.6, fx + 13, y);
    ctx.closePath();
    ctx.fill();
  }
}

/* ─── PTERODAKTIL ────────────────────────────────────── */
function drawPtero() {
  ctx.save();
  const cx = PTERO_X + PTERO_W / 2;
  const cy = ptero.y  + PTERO_H / 2;
  ctx.translate(cx, cy);

  const targetRot = ptero.vy > 2
    ? Math.min(ptero.vy * 4, 70) * (Math.PI / 180)
    : (ptero.vy < -2 ? -12 * (Math.PI / 180) : 0);
  ptero.rot = ptero.rot * 0.82 + targetRot * 0.18;
  ctx.rotate(ptero.rot);

  if (pteroReady && !pteroError) {
    /* Gambar langsung, sudah menghadap kanan */
    ctx.drawImage(pteroImg, -PTERO_W / 2, -PTERO_H / 2, PTERO_W, PTERO_H);
  } else {
    drawPteroShape();
  }

  ctx.restore();
}

function drawPteroShape() {
  const wFlap = Math.sin(wingPhase) * 0.5;

  /* Sayap atas kiri */
  ctx.save();
  ctx.rotate(-wFlap);
  ctx.fillStyle   = "#C0392B";
  ctx.strokeStyle = "#7B1FA2";
  ctx.lineWidth   = 1.8;
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.quadraticCurveTo(-32, -18, -26, -34);
  ctx.quadraticCurveTo(-12, -38,  -4, -20);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* membran */
  ctx.fillStyle = "rgba(180,50,30,0.4)";
  ctx.beginPath();
  ctx.moveTo(-4, -4); ctx.quadraticCurveTo(-20,-12,-20,-26); ctx.quadraticCurveTo(-10,-30,-4,-16); ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Sayap bawah kanan */
  ctx.save();
  ctx.rotate(wFlap * 0.6);
  ctx.fillStyle   = "#C0392B";
  ctx.strokeStyle = "#7B1FA2";
  ctx.lineWidth   = 1.8;
  ctx.beginPath();
  ctx.moveTo(-2, 6);
  ctx.quadraticCurveTo(-28, 20, -22, 34);
  ctx.quadraticCurveTo(-10, 38,  -2, 20);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  /* Badan */
  const bg = ctx.createRadialGradient(-2, 0, 2, 0, 0, 18);
  bg.addColorStop(0,   "#9B59B6");
  bg.addColorStop(0.6, "#6C3483");
  bg.addColorStop(1,   "#4A235A");
  ctx.fillStyle   = bg;
  ctx.strokeStyle = "#7B1FA2";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.ellipse(0, 2, 18, 13, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  /* Perut */
  ctx.fillStyle = "#F0B429";
  ctx.beginPath();
  ctx.ellipse(3, 6, 9, 7, 0.1, 0, Math.PI * 2);
  ctx.fill();

  /* Kepala */
  const hg = ctx.createRadialGradient(14, -18, 1, 15, -17, 10);
  hg.addColorStop(0, "#AB7FD6"); hg.addColorStop(1, "#4A235A");
  ctx.fillStyle = hg; ctx.strokeStyle = "#7B1FA2"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(15, -18, 10, 8, -0.1, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  /* Jambul merah */
  ctx.fillStyle = "#E74C3C"; ctx.strokeStyle = "#922B21"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(8, -22); ctx.quadraticCurveTo(-4, -32, -14, -26);
  ctx.quadraticCurveTo(-6, -18, 6, -16); ctx.closePath();
  ctx.fill(); ctx.stroke();

  /* Paruh */
  ctx.fillStyle = "#E74C3C"; ctx.strokeStyle = "#922B21"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(22,-20); ctx.lineTo(44,-17); ctx.lineTo(22,-14); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#F1948A";
  ctx.beginPath(); ctx.moveTo(22,-14); ctx.lineTo(40,-14); ctx.lineTo(22,-11); ctx.closePath();
  ctx.fill(); ctx.stroke();

  /* Mata */
  ctx.fillStyle = "#FFF9C4"; ctx.beginPath(); ctx.arc(20,-20,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle="#1a0a00"; ctx.beginPath(); ctx.arc(21,-20,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(22.2,-21.2,1.2,0,Math.PI*2); ctx.fill();
}

/* ─── SKOR ───────────────────────────────────────────── */
function drawScore() {
  ctx.save();
  ctx.font        = "bold 34px 'Fredoka One', cursive";
  ctx.textAlign   = "center";
  ctx.lineWidth   = 5;
  ctx.strokeStyle = "rgba(0,0,0,0.5)";
  ctx.fillStyle   = "#FFB74D";
  ctx.strokeText(score, BASE_W / 2, 54);
  ctx.fillText(score,   BASE_W / 2, 54);
  ctx.restore();
}

/* ─── PANEL HELPER ───────────────────────────────────── */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + r, y,     r);
  ctx.closePath();
}

/* ─── OVERLAY: GAME OVER ─────────────────────────────── */
function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const pw = 320, ph = 258;
  const px = (BASE_W - pw) / 2, py = (BASE_H - ph) / 2;

  /* Panel */
  const panelGrad = ctx.createLinearGradient(px, py, px, py + ph);
  panelGrad.addColorStop(0, "#2d0a4e");
  panelGrad.addColorStop(1, "#1a0028");
  ctx.fillStyle   = panelGrad;
  ctx.strokeStyle = "#FF6B35";
  ctx.lineWidth   = 4;
  roundRect(px, py, pw, ph, 22);
  ctx.fill(); ctx.stroke();

  /* Inner border */
  ctx.strokeStyle = "rgba(255,107,53,0.3)";
  ctx.lineWidth   = 1.5;
  roundRect(px + 8, py + 8, pw - 16, ph - 16, 16);
  ctx.stroke();

  /* Judul */
  ctx.font      = "bold 40px 'Fredoka One', cursive";
  ctx.fillStyle = "#FF6B35";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(255,107,53,0.7)";
  ctx.shadowBlur  = 12;
  ctx.fillText("Game Over!", BASE_W / 2, py + 68);
  ctx.shadowBlur = 0;

  /* Ikon */
  ctx.font = "30px sans-serif";
  ctx.fillText("🦕", BASE_W / 2, py + 112);

  /* Skor */
  ctx.font      = "20px 'Fredoka One', cursive";
  ctx.fillStyle = "#FFB74D";
  ctx.fillText(`Skor Kamu : ${score}`,        BASE_W / 2, py + 148);
  ctx.fillStyle = "#CE93D8";
  ctx.fillText(`Skor Terbaik : ${bestScore}`, BASE_W / 2, py + 176);

  /* Tombol */
  const bw = 192, bh = 50;
  const bx = (BASE_W - bw) / 2, by = py + 194;
  const btnGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
  btnGrad.addColorStop(0, "#FF6B35");
  btnGrad.addColorStop(1, "#C0392B");
  ctx.fillStyle   = btnGrad;
  ctx.strokeStyle = "#FF8A65";
  ctx.lineWidth   = 2.5;
  roundRect(bx, by, bw, bh, 14);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 20px 'Fredoka One', cursive";
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur  = 4;
  ctx.fillText("🔄  Main Lagi!", BASE_W / 2, by + 33);
  ctx.shadowBlur  = 0;

  ctx.restore();
}

/* ─── OVERLAY: IDLE ──────────────────────────────────── */
function drawIdle() {
  ctx.save();
  const pw = 310, ph = 190;
  const px = (BASE_W - pw) / 2, py = BASE_H / 2 - 135;

  const panelGrad = ctx.createLinearGradient(px, py, px, py + ph);
  panelGrad.addColorStop(0, "rgba(45,10,78,0.95)");
  panelGrad.addColorStop(1, "rgba(26,0,40,0.95)");
  ctx.fillStyle   = panelGrad;
  ctx.strokeStyle = "#FF6B35";
  ctx.lineWidth   = 3.5;
  roundRect(px, py, pw, ph, 20);
  ctx.fill(); ctx.stroke();

  ctx.font      = "bold 28px 'Fredoka One', cursive";
  ctx.fillStyle = "#FF6B35";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(255,107,53,0.6)";
  ctx.shadowBlur  = 10;
  ctx.fillText("🦕 pterodaktil.fun", BASE_W / 2, py + 52);
  ctx.shadowBlur  = 0;

  ctx.font      = "17px 'Fredoka One', cursive";
  ctx.fillStyle = "#FFB74D";
  ctx.fillText("Spasi / Klik / Sentuh", BASE_W / 2, py + 90);
  ctx.fillText("untuk terbang!", BASE_W / 2, py + 116);

  ctx.font      = "13px 'Fredoka One', cursive";
  ctx.fillStyle = "#CE93D8";
  ctx.fillText("Hindari batu dan lahar!", BASE_W / 2, py + 148);

  ctx.font      = "12px 'Fredoka One', cursive";
  ctx.fillStyle = "rgba(200,150,255,0.6)";
  ctx.fillText("Pterodaktil terkuat di Jurassic! 🌋", BASE_W / 2, py + 172);

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   GAME LOOP
═══════════════════════════════════════════════════════ */
function update() {
  /* Paralaks awan */
  for (const c of clouds) {
    c.x -= c.spd;
    if (c.x + c.r * 2 < 0) c.x = BASE_W + c.r;
  }

  if (gameState !== "PLAYING") return;

  frame++;
  wingPhase += 0.22;

  /* Fisika */
  ptero.vy += GRAVITY;
  ptero.y  += ptero.vy;

  /* Spawn rintangan */
  if (frame % PIPE_INT === 1) spawnPipe();

  /* Update rintangan */
  const playH = BASE_H - GROUND_H;
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    if (!pipes[i].passed && pipes[i].x + PIPE_W < PTERO_X) {
      pipes[i].passed = true;
      score++;
      if (score > bestScore) {
        bestScore = score;
        document.getElementById("best-score").textContent = bestScore;
      }
    }

    if (pipes[i].x + PIPE_W < -20) { pipes.splice(i, 1); continue; }

    if (collides(ptero, pipes[i])) { gameState = "DEAD"; return; }
  }

  /* Tanah & langit */
  if (ptero.y + PTERO_H >= playH) { ptero.y = playH - PTERO_H; gameState = "DEAD"; }
  if (ptero.y <= 0)                { ptero.y = 0;               gameState = "DEAD"; }
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);
  drawBackground();
  for (const p of pipes) drawObstacle(p);
  drawGround();
  drawPtero();
  if (gameState === "PLAYING" || gameState === "DEAD") drawScore();
  if (gameState === "IDLE")  drawIdle();
  if (gameState === "DEAD")  drawGameOver();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

initGame();
loop();
</script>
